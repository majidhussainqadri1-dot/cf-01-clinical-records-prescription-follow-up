name: CF-01 Governance Gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  c1-a-exact-head:
    name: C1-A exact-head governance review — Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Run governance unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate public repository policy
        run: python tools/validate_repository.py .

      - name: Validate whitespace integrity
        run: git diff --check

      - name: Emit exact-head evidence
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "validated_sha=$(git rev-parse HEAD)"
          echo "workflow_run=${GITHUB_RUN_ID}"

  c1-a-merge-ref:
    name: C1-A merge-ref compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout pull-request merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run merge-ref governance tests
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_repository.py .
          git diff --check

      - name: Emit merge-ref evidence
        run: |
          echo "merge_ref_sha=$(git rev-parse HEAD)"
          echo "workflow_run=${GITHUB_RUN_ID}"
