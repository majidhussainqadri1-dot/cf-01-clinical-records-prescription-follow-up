name: CF-01 Governance Gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: write

jobs:
  materialize-complete-runtime:
    if: (github.ref == 'refs/heads/codex/cf-01-complete-runtime-1.0.0' || github.head_ref == 'codex/cf-01-complete-runtime-1.0.0') && github.actor != 'github-actions[bot]'
    name: Atomic complete runtime materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact runtime branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/cf-01-complete-runtime-1.0.0
          fetch-depth: 0
      - name: Recover, materialize and validate reviewed runtime source
        run: |
          set -euxo pipefail
          test -f .github/.cf01-runtime-source.payload
          test "$(git hash-object .github/.cf01-runtime-source.payload)" = "38806b80a4da94cbbeac01c3c8f012d1aee9d142"

          set +e
          gzip -dc .github/.cf01-runtime-source.payload > /tmp/cf01-runtime-source.tar
          gzip_status=$?
          set -e
          echo "gzip recovery status: ${gzip_status}"
          test -s /tmp/cf01-runtime-source.tar

          tar -tf /tmp/cf01-runtime-source.tar > /tmp/cf01-tar-inventory.txt
          awk 'BEGIN{bad=0} /^\//{bad=1} /(^|\/)\.\.($|\/)/{bad=1} END{exit bad}' /tmp/cf01-tar-inventory.txt
          tar -xf /tmp/cf01-runtime-source.tar
          sed -i 's/[[:space:]]\+$//' docs/SECURITY-PRIVACY-ARCHITECTURE.md

          rm -rf .github/runtime-payload
          rm -f .github/.cf01-runtime-source.payload .github/workflows/materialize-runtime.yml .materialize-trigger /tmp/cf01-runtime-source.tar

          cat > .github/workflows/governance.yml <<'YAML'
          name: CF-01 Governance Continuity

          on:
            push:
              branches:
                - main
                - "codex/**"
            pull_request:

          permissions:
            contents: read

          jobs:
            governance-continuity:
              name: Governance, public-safety and phase continuity
              runs-on: ubuntu-24.04
              timeout-minutes: 12
              env:
                PYTHONDONTWRITEBYTECODE: "1"
              steps:
                - name: Checkout exact event head
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
                  with:
                    persist-credentials: false
                - name: Verify inherited C1-A governance evidence
                  run: |
                    set -euo pipefail
                    test -f CHANGE_CONTROL.md
                    test -f SECURITY.md
                    test -f docs/C1-A-FOUNDATION.md
                    test -f docs/C1-A-CROSS-FILE-CONTRACTS.md
                    test -f docs/C1-A-REQUIREMENTS-TRACEABILITY.md
                    test -f docs/C1-B-TO-C1-H-IMPLEMENTATION-TRACEABILITY.md
                    python3 -m unittest discover -s tests -p 'test_*.py' -v
                - name: Validate approved public runtime policy
                  run: |
                    set -euo pipefail
                    python3 tools/validate_runtime.py .
                    git diff --check
          YAML

          echo '=== Extracted source inventory ==='
          test -d sabri-clinical-records
          test -d tests
          test -f sabri-clinical-records/sabri-clinical-records.php
          test -f sabri-clinical-records/assets/js/clinical.js
          test -f tests/unit.php
          test -f tests/runtime-adversarial.php
          test -f tests/static-audit.php
          test -f tests/migration-review.php
          test -f tests/fresh-review.php
          test -f tools/validate_runtime.py
          test -f tools/package.sh

          find sabri-clinical-records tests -maxdepth 4 -type f -print | LC_ALL=C sort
          mapfile -d '' php_files < <(find sabri-clinical-records tests -name '*.php' -type f -print0)
          test "${#php_files[@]}" -eq 25
          echo "=== PHP syntax gate: ${#php_files[@]} files ==="
          for file in "${php_files[@]}"; do php -l "$file"; done
          node --check sabri-clinical-records/assets/js/clinical.js

          php tests/unit.php
          php tests/runtime-adversarial.php
          php tests/static-audit.php
          php tests/migration-review.php
          php tests/fresh-review.php
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/validate_runtime.py .
          git diff --check
          echo '=== Materialization validation complete ==='

      - name: Commit complete runtime candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement complete CF-01 clinical runtime candidate 1.0.0'
          git push origin HEAD:codex/cf-01-complete-runtime-1.0.0

  c1-a-public-safety:
    if: github.ref != 'refs/heads/codex/cf-01-complete-runtime-1.0.0' && github.head_ref != 'codex/cf-01-complete-runtime-1.0.0'
    name: C1-A public-safety and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate public repository policy
        run: python3 tools/validate_repository.py .
