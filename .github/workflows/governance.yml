name: CF-01 Verified Runtime Materialization

on:
  pull_request:
    branches:
      - codex/cf-01-c1-a-foundation
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-complete-runtime:
    if: github.head_ref == 'codex/cf-01-complete-runtime-1.0.0' && github.actor != 'github-actions[bot]'
    name: Materialize and validate complete CF-01 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact runtime branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/cf-01-complete-runtime-1.0.0
          fetch-depth: 0

      - name: Reconstruct and validate reviewed source payload
        run: |
          set -euxo pipefail
          test -d .github/runtime-source-v2
          test "$(find .github/runtime-source-v2 -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 12

          declare -A expected_sizes=(
            [part-000a]=4500 [part-000b]=4500 [part-001]=9000
            [part-002a]=4500 [part-002b]=4500 [part-003]=9000
            [part-004]=9000 [part-005]=9000 [part-006]=9000
            [part-007]=9000 [part-008]=9000 [part-009]=208
          )

          : > /tmp/cf01-runtime-source.b64
          while IFS= read -r part; do
            name="$(basename "$part")"
            normalized="$(mktemp)"
            tr -cd 'A-Za-z0-9+/=' < "$part" > "$normalized"
            size="$(wc -c < "$normalized")"
            hash="$(sha256sum "$normalized" | cut -d' ' -f1)"
            echo "${name}: normalized_size=${size} sha256=${hash}"

            if [ "$name" = 'part-006' ] && [ "$size" -eq 8999 ]; then
              python3 - "$normalized" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          original = path.read_bytes()
          expected = '31b81f8eb22cbc1ff1852105cfc93787afa764257e8a334b76a4f67dd1cb7244'
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          matches = []
          for position in range(len(original) + 1):
              prefix = original[:position]
              suffix = original[position:]
              for value in alphabet:
                  candidate = prefix + bytes((value,)) + suffix
                  if hashlib.sha256(candidate).hexdigest() == expected:
                      matches.append((position, value, candidate))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one cryptographic recovery match, found {len(matches)}')
          position, value, candidate = matches[0]
          path.write_bytes(candidate)
          print(f'Recovered part-006 at byte offset {position} with Base64 character {chr(value)!r}')
          PY
              size="$(wc -c < "$normalized")"
              hash="$(sha256sum "$normalized" | cut -d' ' -f1)"
              test "$size" -eq 9000
              test "$hash" = '31b81f8eb22cbc1ff1852105cfc93787afa764257e8a334b76a4f67dd1cb7244'
            else
              test "$size" -eq "${expected_sizes[$name]}"
            fi

            cat "$normalized" >> /tmp/cf01-runtime-source.b64
            rm -f "$normalized"
          done < <(find .github/runtime-source-v2 -maxdepth 1 -type f -name 'part-*' -print | LC_ALL=C sort)

          test "$(wc -c < /tmp/cf01-runtime-source.b64)" -eq 81208
          base64 --decode /tmp/cf01-runtime-source.b64 > /tmp/cf01-runtime-source.tar.gz
          echo "Payload SHA-256: $(sha256sum /tmp/cf01-runtime-source.tar.gz | cut -d' ' -f1)"
          gzip -t /tmp/cf01-runtime-source.tar.gz
          tar -tzf /tmp/cf01-runtime-source.tar.gz > /tmp/cf01-runtime-inventory.txt
          test "$(wc -l < /tmp/cf01-runtime-inventory.txt)" -ge 40
          awk 'BEGIN{bad=0} /^\//{bad=1} /(^|\/)\.\.($|\/)/{bad=1} END{exit bad}' /tmp/cf01-runtime-inventory.txt
          tar -xzf /tmp/cf01-runtime-source.tar.gz

          rm -rf .github/runtime-source-v2 .github/runtime-payload
          rm -f .github/.cf01-runtime-source.payload
          rm -f .github/workflows/materialize-runtime.yml .materialize-trigger
          rm -f /tmp/cf01-runtime-source.b64 /tmp/cf01-runtime-source.tar.gz /tmp/cf01-runtime-inventory.txt

      - name: Verify complete source inventory
        run: |
          set -euxo pipefail
          test -f sabri-clinical-records/sabri-clinical-records.php
          test -f sabri-clinical-records/assets/js/clinical.js
          test -f tests/unit.php
          test -f tests/runtime-adversarial.php
          test -f tests/static-audit.php
          test -f tests/migration-review.php
          test -f tests/fresh-review.php
          test -f tools/validate_runtime.py
          test -f tools/package.sh
          test -f .github/workflows/final-evidence.yml
          mapfile -d '' php_files < <(find sabri-clinical-records tests -type f -name '*.php' -print0)
          echo "PHP source/test files: ${#php_files[@]}"
          test "${#php_files[@]}" -eq 26
          printf '%s\n' "${php_files[@]}" | LC_ALL=C sort

      - name: Run baseline review and correction evidence
        run: |
          set -euxo pipefail
          mapfile -d '' php_files < <(find sabri-clinical-records tests -type f -name '*.php' -print0)
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          node --check sabri-clinical-records/assets/js/clinical.js
          php tests/unit.php
          php tests/runtime-adversarial.php
          php tests/static-audit.php
          php tests/migration-review.php
          php tests/fresh-review.php
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/validate_runtime.py .
          git diff --check

      - name: Commit reviewable runtime source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement complete CF-01 clinical runtime candidate 1.0.0'
          git push origin HEAD:codex/cf-01-complete-runtime-1.0.0
