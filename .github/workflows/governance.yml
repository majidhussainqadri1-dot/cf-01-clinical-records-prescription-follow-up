name: CF-01 Exact-Head Review Gates

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  php-review:
    name: PHP ${{ matrix.php }} clinical review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run syntax and ten review suites
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app "php:${{ matrix.php }}-cli" sh -lc '
            set -eu
            find sabri-clinical-records tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null
            php tests/unit.php
            php tests/runtime-adversarial.php
            php tests/static-audit.php
            php tests/migration-review.php
            php tests/fresh-review.php
            php tests/security-corrections.php
            php tests/three-plan-corrections.php
            php tests/adversarial-round3.php
            php tests/adversarial-round4.php
            php tests/adversarial-round4-compensation.php
          '

  forty-round-review:
    name: Forty review and correction rounds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run 40 review-to-correction cycles
        run: |
          set -euo pipefail
          python3 tools/run_40_reviews.py
          php tests/three-plan-corrections.php
          php tests/adversarial-round3.php
          php tests/adversarial-round4.php
          php tests/adversarial-round4-compensation.php

  policy-package-review:
    name: Policy, JavaScript and deterministic package review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate repository and runtime policy
        run: |
          set -euo pipefail
          node --check sabri-clinical-records/assets/js/clinical.js
          php tests/security-corrections.php
          php tests/three-plan-corrections.php
          php tests/adversarial-round3.php
          php tests/adversarial-round4.php
          php tests/adversarial-round4-compensation.php
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/validate_runtime.py .
          git diff --check
      - name: Verify deterministic installable package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync zip unzip >/dev/null
          bash tools/package.sh
          first_hash="$(sha256sum build/cf-01-clinical-records-prescription-follow-up-1.0.0.zip | awk '{print $1}')"
          cp build/cf-01-clinical-records-prescription-follow-up-1.0.0.zip /tmp/cf01-first.zip
          bash tools/package.sh
          second_hash="$(sha256sum build/cf-01-clinical-records-prescription-follow-up-1.0.0.zip | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          cmp -s /tmp/cf01-first.zip build/cf-01-clinical-records-prescription-follow-up-1.0.0.zip
          unzip -t build/cf-01-clinical-records-prescription-follow-up-1.0.0.zip >/dev/null
          test "$(unzip -Z1 build/cf-01-clinical-records-prescription-follow-up-1.0.0.zip | cut -d/ -f1 | sort -u)" = "sabri-clinical-records"
