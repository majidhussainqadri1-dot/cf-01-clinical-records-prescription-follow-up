name: CF-01 Materialize Communication Fail-Closed Regression

on:
  push:
    branches:
      - codex/cf01-three-plan-complete-hardening-1.0.1
    paths:
      - .github/workflows/cf01-communication-test-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/cf01-three-plan-complete-hardening-1.0.1
          persist-credentials: true
      - name: Correct communication outage regression
        shell: bash
        env:
          TEST_OLD: ""
          TEST_NEW: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('tests/runtime-adversarial.php')
          text = path.read_text()
          old = base64.b64decode(os.environ['TEST_OLD']).decode()
          new = base64.b64decode(os.environ['TEST_NEW']).decode()
          if old not in text:
              raise SystemExit('communication fail-closed test marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/cf01-communication-test-materialize.yml
          php -l tests/runtime-adversarial.php >/dev/null
          git diff --check
      - name: Commit corrected regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'test: simulate communication provider outage explicitly'
          git push origin HEAD:codex/cf01-three-plan-complete-hardening-1.0.1
