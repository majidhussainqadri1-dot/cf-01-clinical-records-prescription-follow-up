name: CF-01 Materialize Test Providers

on:
  push:
    branches:
      - codex/cf01-three-plan-complete-hardening-1.0.1
    paths:
      - .github/workflows/cf01-test-provider-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/cf01-three-plan-complete-hardening-1.0.1
          persist-credentials: true
      - name: Add deterministic native-owner test providers
        shell: bash
        env:
          CF01_PROVIDER_BLOCK: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('tests/bootstrap.php')
          text = path.read_text()
          marker = "$files = array("
          if 'cf01_subject_identity_assertion' not in text:
              block = base64.b64decode(__import__('os').environ['CF01_PROVIDER_BLOCK']).decode()
              if marker not in text:
                  raise SystemExit('bootstrap insertion marker missing')
              text = text.replace(marker, block + '\n' + marker, 1)
              path.write_text(text)
          PY
          rm -f .github/workflows/cf01-test-provider-materialize.yml
          php -l tests/bootstrap.php >/dev/null
          git diff --check
      - name: Commit deterministic test providers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'test: add CF-01 native-owner contract fixtures'
          git push origin HEAD:codex/cf01-three-plan-complete-hardening-1.0.1
