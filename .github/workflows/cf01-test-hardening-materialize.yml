name: CF-01 Materialize Hardening Regression Tests

on:
  push:
    branches:
      - codex/cf01-three-plan-complete-hardening-1.0.1
    paths:
      - .github/workflows/cf01-test-hardening-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/cf01-three-plan-complete-hardening-1.0.1
          persist-credentials: true
      - name: Extend permanent three-plan regression gate
        shell: bash
        env:
          CF01_VARS: ""
          CF01_CHECKS: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('tests/three-plan-corrections.php')
          text = path.read_text()
          if '$authorization = $read(' not in text:
              vars_block = base64.b64decode(os.environ['CF01_VARS']).decode()
              marker = "$patients = $read('sabri-clinical-records/includes/class-cf01-patients.php');\n"
              if marker not in text:
                  raise SystemExit('variable insertion marker missing')
              text = text.replace(marker, marker + vars_block, 1)
          if 'function relationship_source' not in text:
              checks_block = base64.b64decode(os.environ['CF01_CHECKS']).decode()
              marker = 'if ($failures) {'
              if marker not in text:
                  raise SystemExit('check insertion marker missing')
              text = text.replace(marker, checks_block + marker, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/cf01-test-hardening-materialize.yml
          php -l tests/three-plan-corrections.php >/dev/null
          php tests/three-plan-corrections.php
          git diff --check
      - name: Commit permanent regression gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'test: enforce complete CF-01 three-plan hardening'
          git push origin HEAD:codex/cf01-three-plan-complete-hardening-1.0.1
