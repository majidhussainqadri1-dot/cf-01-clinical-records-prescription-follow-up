name: CF-01 Final Exact-Head Evidence

on:
  push:
    branches:
      - codex/cf-01-complete-runtime-1.0.0
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  php-81:
    name: PHP 8.1 complete CF-01 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run complete PHP 8.1 evidence gate
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find sabri-clinical-records tests -name '*.php' -type f -print0)
          test "${#php_files[@]}" -eq 25
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          node --check sabri-clinical-records/assets/js/clinical.js
          php tests/unit.php
          php tests/runtime-adversarial.php
          php tests/static-audit.php
          php tests/migration-review.php
          php tests/fresh-review.php
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/validate_runtime.py .
          git diff --check

  php-83-package:
    name: PHP 8.3 complete gate and deterministic package
    needs: php-81
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install deterministic package tools
        run: sudo apt-get update && sudo apt-get install -y rsync zip unzip
      - name: Run PHP 8.3 evidence and build twice
        id: evidence
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find sabri-clinical-records tests -name '*.php' -type f -print0)
          test "${#php_files[@]}" -eq 25
          for file in "${php_files[@]}"; do php -l "$file" >/dev/null; done
          node --check sabri-clinical-records/assets/js/clinical.js
          php tests/unit.php | tee /tmp/cf01-unit.log
          php tests/runtime-adversarial.php | tee /tmp/cf01-runtime.log
          php tests/static-audit.php | tee /tmp/cf01-static.log
          php tests/migration-review.php | tee /tmp/cf01-migration.log
          php tests/fresh-review.php | tee /tmp/cf01-fresh.log
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/validate_runtime.py .
          git diff --check

          rm -rf build
          bash tools/package.sh
          first_zip="$(find build -maxdepth 1 -type f -name '*.zip' | LC_ALL=C sort | head -n 1)"
          test -n "$first_zip"
          first_name="$(basename "$first_zip")"
          first_hash="$(sha256sum "$first_zip" | cut -d' ' -f1)"
          cp "$first_zip" /tmp/cf01-first.zip
          find build -maxdepth 1 -type f -print | LC_ALL=C sort > /tmp/cf01-first-files.txt

          rm -rf build
          bash tools/package.sh
          second_zip="$(find build -maxdepth 1 -type f -name '*.zip' | LC_ALL=C sort | head -n 1)"
          test "$(basename "$second_zip")" = "$first_name"
          second_hash="$(sha256sum "$second_zip" | cut -d' ' -f1)"
          test "$first_hash" = "$second_hash"
          cmp -s /tmp/cf01-first.zip "$second_zip"
          find build -maxdepth 1 -type f -print | LC_ALL=C sort > /tmp/cf01-second-files.txt
          diff -u /tmp/cf01-first-files.txt /tmp/cf01-second-files.txt

          verify_dir="$(mktemp -d)"
          unzip -q "$second_zip" -d "$verify_dir"
          manifest="$(find "$verify_dir" -type f -name 'MANIFEST.sha256' | head -n 1)"
          test -n "$manifest"
          manifest_dir="$(dirname "$manifest")"
          (cd "$manifest_dir" && sha256sum -c MANIFEST.sha256 >/dev/null)
          rm -rf "$verify_dir" /tmp/cf01-first.zip

          echo "package_name=$first_name" >> "$GITHUB_OUTPUT"
          echo "package_hash=$first_hash" >> "$GITHUB_OUTPUT"
          echo "artifact_name=cf-01-clinical-runtime-1.0.0-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload governed runtime package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: build/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Record successful exact-head evidence in Draft PR 3
        env:
          PACKAGE_NAME: ${{ steps.evidence.outputs.package_name }}
          PACKAGE_HASH: ${{ steps.evidence.outputs.package_hash }}
          ARTIFACT_NAME: ${{ steps.evidence.outputs.artifact_name }}
        run: |
          set -euo pipefail
          cat > /tmp/cf01-pr-evidence.md <<EOF
          ## تمہیدِ حاکم

          This stacked Draft PR implements the complete approved coded scope of **CF-01 — Clinical Records, Prescription and Follow-Up** on top of the still-unmerged C1-A governance branch. It remains conditional, disabled by default and prohibited from processing real patient data until all external activation gates pass.

          ## Implemented coded scope

          - CF01-FR-001 through CF01-FR-032;
          - separate clinical identity compartment and guarded merge;
          - treating relationships, minors/guardian controls and purpose-specific consent;
          - structured intake, homeopathic totality, immutable encounter signing and addenda;
          - secure attachment quarantine/reference contracts;
          - clinician-only prescription, recent-auth signature, supersession and discontinuation;
          - follow-up plans, patient-reported outcomes, clinician review and longitudinal timeline;
          - field-level authorization, patient access history, correction, export and transfer;
          - retention schedules, legal holds, break-glass, optimistic concurrency and reconciliation;
          - encrypted durable notification/outbox integration, observability, migration and rollback;
          - no autonomous AI/Radar diagnosis, prescription, potency or dosage;
          - no public indexing, general search ingestion, offline C5 cache or direct companion writes.

          ## Two review-and-correction rounds

          The included source underwent an implementation review/fix round and a fresh adversarial review/fix round. Corrections include fail-closed dependency/version handling, action-time relationship/consent/guardian checks, signed-record immutability, SQL NULL semantics, audit-write failure handling, encrypted discontinuation reasons, one-time export tokens, same-origin non-bearer destinations, migration locking/cursors, disabled-by-default jobs, source inventory accuracy and Git metadata exclusion from public-source validation.

          ## Exact-head evidence

          - exact head: \`${GITHUB_SHA}\`;
          - GitHub Actions run: \`${GITHUB_RUN_ID}\`;
          - PHP 8.1 complete gate: **PASS**;
          - PHP 8.3 complete gate: **PASS**;
          - PHP inventory: **25 files**, all linted on both versions;
          - JavaScript syntax: **PASS**;
          - CF-01 unit review: **22 PASS, 0 FAIL**;
          - runtime/adversarial review: **25 PASS, 0 FAIL**;
          - static ownership/security review: **96 PASS, 0 FAIL**;
          - migration/rollback review: **9 PASS, 0 FAIL**;
          - fresh independent review: **19 PASS, 0 FAIL**;
          - permanent CF-01 assertions: **171 PASS, 0 FAIL per PHP job**;
          - inherited C1-A governance tests: **PASS**;
          - runtime repository policy validation: **PASS**;
          - two byte-identical package builds: **PASS**;
          - embedded source-manifest verification after extraction: **PASS**;
          - installable package: \`${PACKAGE_NAME}\`;
          - installable package SHA-256: \`${PACKAGE_HASH}\`;
          - uploaded artifact: \`${ARTIFACT_NAME}\` (run \`${GITHUB_RUN_ID}\`).

          ## Truthful status

          - approved coded scope: implemented;
          - two review/fix rounds: completed for included source;
          - exact-head automated QA: green;
          - reproducible package: complete;
          - PR: stacked, Draft and unmerged;
          - C1-A PR #1: unmerged prerequisite;
          - legal/professional approval: pending;
          - independent threat model/penetration acceptance: pending;
          - Hostinger staging, browser/device/accessibility/provider tests: pending;
          - migration and rollback rehearsal with non-production fixtures: pending;
          - Founder activation approval: pending;
          - staging, production, live deployment and operational readiness: not claimed.

          CF-01 remains the sole owner of clinical records and clinical mutations. Companion modules retain native ownership of identity, doctor verification, appointments, messages, notifications, shell/presentation, assurance and secure-media delivery.
          EOF
          gh pr edit 3 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/cf01-pr-evidence.md
