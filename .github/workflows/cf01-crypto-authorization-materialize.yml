name: CF-01 Materialize Crypto Authorization

on:
  push:
    branches:
      - codex/cf01-three-plan-complete-hardening-1.0.1
    paths:
      - .github/workflows/cf01-crypto-authorization-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/cf01-three-plan-complete-hardening-1.0.1
          persist-credentials: true
      - name: Add key-rotation authorization
        shell: bash
        env:
          HIGH_OLD: "J3J1bl9jbGluaWNhbF9taWdyYXRpb24nLCAncnVuX2NsaW5pY2FsX3JvbGxiYWNrJywgJ2Rpc2FibGVfbW9kdWxlJw=="
          HIGH_NEW: "J3J1bl9jbGluaWNhbF9taWdyYXRpb24nLCAncnVuX2NsaW5pY2FsX3JvbGxiYWNrJywgJ3JvdGF0ZV9jbGluaWNhbF9rZXknLCAnZGlzYWJsZV9tb2R1bGUn"
          CAP_OLD: "J2Rpc2FibGVfbW9kdWxlJyA9PiAnY2YwMV9hY3RpdmF0ZV9jbGluaWNhbCcs"
          CAP_NEW: "J2Rpc2FibGVfbW9kdWxlJyA9PiAnY2YwMV9hY3RpdmF0ZV9jbGluaWNhbCcsCiAgICAgICAgICAgICdyb3RhdGVfY2xpbmljYWxfa2V5JyA9PiAnY2YwMV9tYW5hZ2VfY2xpbmljYWxfa2V5cycs"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('sabri-clinical-records/includes/class-cf01-authorization.php')
          text = path.read_text()
          for old_key, new_key in [('HIGH_OLD', 'HIGH_NEW'), ('CAP_OLD', 'CAP_NEW')]:
              old = base64.b64decode(os.environ[old_key]).decode()
              new = base64.b64decode(os.environ[new_key]).decode()
              if old not in text:
                  raise SystemExit('authorization insertion marker missing: ' + old_key)
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/cf01-crypto-authorization-materialize.yml
          php -l sabri-clinical-records/includes/class-cf01-authorization.php >/dev/null
          php -l sabri-clinical-records/includes/class-cf01-crypto.php >/dev/null
          git diff --check
      - name: Commit authorization correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'fix: govern clinical key rotation with step-up authorization'
          git push origin HEAD:codex/cf01-three-plan-complete-hardening-1.0.1
