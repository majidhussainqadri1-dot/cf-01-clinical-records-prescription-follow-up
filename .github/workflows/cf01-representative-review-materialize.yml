name: CF-01 Materialize Representative Identity Review

on:
  push:
    branches:
      - codex/cf01-three-plan-complete-hardening-1.0.1
    paths:
      - .github/workflows/cf01-representative-review-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/cf01-three-plan-complete-hardening-1.0.1
          persist-credentials: true
      - name: Align representative identity invariant
        shell: bash
        env:
          R35_OLD: "Um91bmQoMzUsICJSZXByZXNlbnRhdGl2ZSBpZGVudGl0eSBiaW5kaW5nIiwgY29udGFpbnMoInJpZ2h0cyIsICJndWFyZGlhbl9vcl9yZXByZXNlbnRhdGl2ZSgkYWN0b3JfaWQiLCAiISRzYW1lX2FjdG9yIikpLA=="
          R35_NEW: "Um91bmQoMzUsICJSZXByZXNlbnRhdGl2ZSBpZGVudGl0eSBiaW5kaW5nIiwgY29udGFpbnMoInJpZ2h0cyIsICJndWFyZGlhbl9vcl9yZXByZXNlbnRhdGl2ZSgkYWN0b3JfaWQiLCAiQ0YwMV9Sb2xlX0NvbnRleHQ6OnJlc29sdmUiLCAiaGFzaF9lcXVhbHMiKSks"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('tools/run_40_reviews.py')
          text = path.read_text()
          old = base64.b64decode(os.environ['R35_OLD']).decode()
          new = base64.b64decode(os.environ['R35_NEW']).decode()
          if old not in text:
              raise SystemExit('representative invariant marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/cf01-representative-review-materialize.yml
          python3 -m py_compile tools/run_40_reviews.py
          git diff --check
      - name: Commit representative invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'test: align representative identity review with role assertions'
          git push origin HEAD:codex/cf01-three-plan-complete-hardening-1.0.1
