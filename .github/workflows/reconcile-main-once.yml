name: CF-01 One-Time Main Reconciliation

on:
  push:
    branches:
      - codex/cf-01-complete-runtime-1.0.0

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor == 'majidhussainqadri1-dot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact runtime branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: codex/cf-01-complete-runtime-1.0.0
      - name: Merge canonical main and remove this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          allowed='^(README\.md|CHANGE_CONTROL\.md|\.github/workflows/governance\.yml|tools/validate_repository\.py|tests/test_validate_repository\.py|docs/C1-A-EVIDENCE-MANIFEST\.md)$'
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if ! printf '%s\n' "$path" | grep -Eq "$allowed"; then
                echo "Unexpected merge conflict: $path" >&2
                git merge --abort
                exit 1
              fi
              git checkout --ours -- "$path"
              git add "$path"
            done <<< "$conflicts"
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without a resolvable conflict list." >&2
            git merge --abort
            exit 1
          fi
          rm -f .github/workflows/reconcile-main-once.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile canonical main into runtime candidate"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:codex/cf-01-complete-runtime-1.0.0
