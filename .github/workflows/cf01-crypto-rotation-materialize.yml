name: CF-01 Materialize Versioned Encryption Key Rotation

on:
  push:
    branches:
      - codex/cf01-three-plan-complete-hardening-1.0.1
    paths:
      - .github/workflows/cf01-crypto-rotation-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/cf01-three-plan-complete-hardening-1.0.1
          persist-credentials: true
      - name: Materialize versioned encryption key rotation
        shell: bash
        env:
          CF01_CRYPTO_SOURCE: " "
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          crypto = base64.b64decode(os.environ['CF01_CRYPTO_SOURCE']).decode()
          Path('sabri-clinical-records/includes/class-cf01-crypto.php').write_text(crypto)
          authorization = Path('sabri-clinical-records/includes/class-cf01-authorization.php')
          text = authorization.read_text()
          old = "'run_clinical_migration', 'run_clinical_rollback', 'disable_module'"
          new = "'run_clinical_migration', 'run_clinical_rollback', 'rotate_clinical_key', 'disable_module'"
          if old not in text:
              raise SystemExit('high-risk insertion marker missing')
          text = text.replace(old, new, 1)
          old = "'disable_module' => 'cf01_activate_clinical',"
          new = "'disable_module' => 'cf01_activate_clinical',\n            'rotate_clinical_key' => 'cf01_manage_clinical_keys',"
          if old not in text:
              raise SystemExit('capability insertion marker missing')
          authorization.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/cf01-crypto-rotation-materialize.yml
          find sabri-clinical-records tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/runtime-adversarial.php
          git diff --check
      - name: Commit versioned key rotation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'fix: implement versioned clinical encryption key rotation'
          git push origin HEAD:codex/cf01-three-plan-complete-hardening-1.0.1
